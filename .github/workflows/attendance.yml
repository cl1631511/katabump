name: PT Attendance Check-in

on:
  schedule:
  # 每天 UTC 1:17 (北京时间 09:17) 运行，逐站点串行签到
  - cron: '17 1 * * *'
  workflow_dispatch: # 允许手动触发
  # 临时：签到脚本还在校准，改一次代码就想看一次结果。收敛后删掉这个 push 触发。
  push:
    branches: [main]
    paths:
    - attendance_checkin.py
    - tests/**
    - .github/workflows/attendance.yml

jobs:
  checkin:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 只为了把脱敏日志推到 checkin-evidence 分支（自检回路，见下一步）

    steps:
    - uses: actions/checkout@v6

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install System & Python Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
        pip install seleniumbase requests
        seleniumbase install chromedriver

    # 与 renew.yml 同一份 PROXY_URL / PROXY_CHAIN_URL secret，同一个 127.0.0.1:8080 出口池。
    - name: Start Proxy (sing-box)
      env:
        PROXY_URL: ${{ secrets.PROXY_URL }}
        PROXY_CHAIN_URL: ${{ secrets.PROXY_CHAIN_URL }}
      run: |
        if [ -z "$PROXY_URL" ]; then
          echo "PROXY_URL not set, skipping sing-box setup."
          exit 0
        fi
        SINGBOX_VER="1.13.16"
        echo "Downloading sing-box v${SINGBOX_VER}..."
        wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VER}/sing-box-${SINGBOX_VER}-linux-amd64.tar.gz"
        tar -xzf "sing-box-${SINGBOX_VER}-linux-amd64.tar.gz"
        mv "sing-box-${SINGBOX_VER}-linux-amd64/sing-box" ./sing-box
        chmod +x ./sing-box
        echo "Generating sing-box config from PROXY_URL..."
        python proxy_handler.py
        echo "Starting sing-box..."
        nohup ./sing-box run -c config.json > singbox.log 2>&1 &
        sleep 3
        echo "--- singbox.log ---"
        cat singbox.log || true
        echo "--- health check ---"
        if ! pgrep -f "./sing-box" > /dev/null; then
          echo "❌ sing-box process not running"
          exit 1
        fi
        echo "✅ sing-box process alive"
        (command -v ss >/dev/null && ss -tlnp 2>/dev/null | grep 8080) || echo "(ss unavailable)"
        echo "--- proxy connectivity test ---"
        if curl -sS -m 20 -x http://127.0.0.1:8080 https://ipv4.icanhazip.com; then
          echo ""
          echo "  <- proxy OK"
          grep -iE "urltest|selected|node-|ERROR" singbox.log | tail -8 || true
        else
          echo ""
          echo "❌ proxy connect FAILED — dialer/chain unreachable from this runner"
          cat singbox.log || true
          exit 1
        fi

    # 站点表在 attendance_checkin.py 的 SITES 里；每站一个 Cookie secret，缺哪个就只有那个站报红。
    # 只想跑其中一站时加 CHECKIN_SITES: "audiences" 或 "mua"。
    - name: Run Check-in Script
      env:
        AUDIENCES_COOKIE: ${{ secrets.AUDIENCES_COOKIE }}
        MUA_COOKIE: ${{ secrets.MUA_COOKIE }}
        PROXY_URL: ${{ secrets.PROXY_URL }}
        PROXY_CHAIN_URL: ${{ secrets.PROXY_CHAIN_URL }}
        PROXY_SERVER: http://127.0.0.1:8080
        IS_PROXY: "true"
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        set -o pipefail
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 attendance_checkin.py 2>&1 | tee checkin.log

    # 自检回路：库上没有 API token 可读日志，所以把洗过的日志推到 checkin-evidence 分支，
    # 改代码那边 git fetch 就能看到这一轮到底走到哪一步。只推白名单行，页面原文不进仓库。
    - name: Push sanitized run log to checkin-evidence
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -e
        [ -f checkin.log ] || : > checkin.log
        python3 attendance_checkin.py --sanitize-log checkin.log > checkin-evidence.md
        {
          echo ""
          echo "- commit ${GITHUB_SHA:0:7} | run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT | $GITHUB_EVENT_NAME"
          echo "- 结束(UTC) $(date -u '+%F %T')"
        } >> checkin-evidence.md
        echo "----- 即将推上去的证据 -----"
        cat checkin-evidence.md
        # token 走 http.extraHeader，不拼进 URL：git 报错时会原样打印 URL
        HDR="http.extraHeader=AUTHORIZATION: bearer ${GH_TOKEN}"
        REPO="https://github.com/${GITHUB_REPOSITORY}.git"
        rm -rf ev && mkdir ev
        if git ls-remote --heads "$REPO" checkin-evidence | grep -q checkin-evidence; then
          git -c "$HDR" clone -q --depth 1 -b checkin-evidence "$REPO" ev
        else
          git init -q ev && git -C ev remote add origin "$REPO"   # 首轮：分支还不存在
        fi
        cd ev
        cp ../checkin-evidence.md .
        git -c "$HDR" -c user.name=github-actions -c user.email=actions@github.com \
            add -f checkin-evidence.md
        git -c "$HDR" -c user.name=github-actions -c user.email=actions@github.com \
            commit -q -m "check-in evidence run ${GITHUB_RUN_ID}" --allow-empty
        git -c "$HDR" push -q --force origin HEAD:checkin-evidence
        echo "✅ 证据已推到 checkin-evidence:checkin-evidence.md"

    # 不再上传 artifact：库是公开的，artifact 同样公开，而 attendance_result_*.txt /
    # attendance_*.png 里全是登录后的页面原文（含账号名）。措辞校准靠脚本自己打的
    # 🔎 结构计数 + 🧾 关键词命中行，两者都只有站点自己的措辞，不含个人信息。
